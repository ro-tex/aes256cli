# https://goreleaser.com/customization/
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: aes256cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: aes256cli
    binaries:
      - aes256cli
    homepage: https://github.com/ro-tex/aes256cli
    description: "Encrypt and decrypt files with AES-256"
    license: MIT
    # GoReleaser only generates the cask. `just release` adds the quarantine
    # step as `postflight_steps`, which GoReleaser can't generate, checks it
    # with `brew style` and pushes it to the tap.
    skip_upload: true
    repository:
      owner: ro-tex
      name: homebrew-tap
