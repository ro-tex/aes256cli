# https://goreleaser.com/customization/
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: aes256cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: aes256cli
    binaries:
      - aes256cli
    homepage: https://github.com/ro-tex/aes256cli
    description: A simple file encrypt/decrypt tool using AES-256.
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    repository:
      owner: ro-tex
      name: homebrew-tap
      git:
        url: git@github.com:ro-tex/homebrew-tap.git
        private_key: /Users/inovakov/.ssh/id_ed25519
    hooks:
      post:
        install: |
          if OS.mac?
            # The binary is not signed, so remove the quarantine attribute
            # to keep macOS Gatekeeper from blocking it.
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aes256cli"]
          end
